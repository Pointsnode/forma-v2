name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  guards:
    name: Security gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secret scan (gitleaks)
        # Filesystem scan of the checked-out tree (pinned image). `dir` mode has
        # no base^..head git range, so it is immune to the root-commit history
        # artifact that breaks gitleaks-action's PR range on this branch.
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.3 dir /repo --redact -v --exit-code 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:service-role
      - run: npm run check:public-env
      - run: npm run check:test-scoping
      - run: npm audit --audit-level=high

  build:
    name: Typecheck, lint, build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  db:
    name: Hermetic DB + logic tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:db
      - run: npm run test:logic
